server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/pos/usuario/**
            - id: subscription-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/pos/planes/**
            - id: subscription-suscripciones
              uri: http://localhost:8081
              predicates:
                - Path=/api/pos/suscripciones/**
            - id: inventario-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/surtiana/inventario/**
            - id: categoria-service
              # Migrado al monolito modular (pos-backend/monolito-modular) el
              # 2026-09-11. categoria-service standalone (puerto 8083) sigue
              # corriendo en paralelo para poder hacer rollback (volver este
              # uri a http://localhost:8083) durante el período de quemado —
              # ver MIGRACION-MONOLITO-MODULAR.md.
              uri: http://localhost:9000
              predicates:
                - Path=/api/pos/categorias/**
            - id: proveedor-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/pos/proveedores/**
            - id: compra-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/pos/compras/**
            - id: cliente-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/pos/clientes/**
            - id: venta-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/pos/ventas/**
            - id: empresa-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/pos/empresa/**
            - id: facturacion-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/pos/facturacion/**
            - id: contabilidad-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/pos/contabilidad/**
            - id: nomina-service
              uri: http://localhost:8092
              predicates:
                  - Path=/api/pos/nomina/**

eureka:
  client:
    enabled: false
jwt:
  secret: ${JWT_SECRET:}

logging:
  level:
    org.springframework.cloud.gateway.server.mvc: TRACE