server:
  port: 8090

# Cutover completo al monolito modular (pos-backend/monolito-modular) el
# 2026-09-11: los 13 microservicios de abajo ya están migrados, así que
# todas las rutas apuntan a MONOLITO_URL (default http://localhost:9000,
# funciona igual que antes en desarrollo local). En docker-compose se
# sobreescribe a http://monolito:9000 porque ahí los contenedores se ven
# por nombre de servicio, no por localhost. Cada microservicio standalone
# sigue corriendo en paralelo (mismo puerto de siempre) para poder hacer
# rollback ruta por ruta durante el período de quemado — ver
# MIGRACION-MONOLITO-MODULAR.md para el puerto original de cada uno.
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Panel de super administrador (solo rol SUPERADMIN, ver
            # PermisosInterceptor) — vive en facturacion-service porque ahí
            # están las credenciales de Factus que administra.
            - id: admin-plataforma
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/admin/**
            - id: auth-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/usuario/**
            # subscription-service (planes y suscripciones) deshabilitado
            # temporalmente (2026-09-11, pedido del usuario): por ahora solo
            # se permite iniciar sesión, el alta de empresas nuevas vía
            # planes/registro/pago queda cerrada. Sin ruta acá, el gateway
            # responde 404 a /api/pos/planes/** y /api/pos/suscripciones/**.
            # Reactivar agregando de nuevo estas dos rutas apuntando a
            # http://localhost:9000.
            - id: inventario-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/surtiana/inventario/**
            - id: categoria-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/categorias/**
            - id: proveedor-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/proveedores/**
            - id: compra-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/compras/**
            - id: cliente-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/clientes/**
            - id: venta-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/ventas/**
            - id: empresa-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/empresa/**
            - id: facturacion-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/facturacion/**
            - id: contabilidad-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                - Path=/api/pos/contabilidad/**
            - id: nomina-service
              uri: ${MONOLITO_URL:http://localhost:9000}
              predicates:
                  - Path=/api/pos/nomina/**

eureka:
  client:
    enabled: false
jwt:
  secret: ${JWT_SECRET:}

logging:
  level:
    org.springframework.cloud.gateway.server.mvc: TRACE
