spring.application.name=empresa

server.port=${SERVER_PORT:8088}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Almacenamiento local del logo de la empresa (carpeta relativa al proceso).
# app.public-url debe apuntar a donde este servicio es alcanzable directamente
# (el logo se sirve como recurso estático, no a través del gateway).
app.upload.dir=${UPLOAD_DIR:uploads/logos}
app.public-url=${APP_PUBLIC_URL:http://localhost:8088}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

contabilidad.service.url=http://localhost:8091/api/pos/contabilidad/cuentas
