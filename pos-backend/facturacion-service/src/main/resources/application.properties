spring.application.name=facturacion

server.port=${SERVER_PORT:8089}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Tolera campos extra al deserializar respuestas de otros microservicios
# (venta-service, cliente-service, empresa-service devuelven más campos de los que este servicio necesita)
spring.jackson.deserialization.fail-on-unknown-properties=false

# Otros microservicios (llamadas directas, sin pasar por el gateway)
venta.service.url=http://localhost:8087/api/pos/ventas
cliente.service.url=http://localhost:8086/api/pos/clientes
empresa.service.url=http://localhost:8088/api/pos/empresa
compra.service.url=http://localhost:8085/api/pos/compras
proveedor.service.url=http://localhost:8084/api/pos/proveedores
nomina.service.url=http://localhost:8092/api/pos/nomina

# Llave para cifrar credenciales de Factus (client_secret y password) antes de
# guardarlas en BD. Genera una con: openssl rand -base64 32
cert.encryption.key=${CERT_ENCRYPTION_KEY:}

# Factus (proveedor tecnológico habilitado ante la DIAN) — cada empresa tiene sus
# propias credenciales (se guardan por empresa en ConfiguracionDian, no acá). Esto
# solo dice a qué ambiente de Factus le pega el backend.
factus.base.url=${FACTUS_BASE_URL:https://api-sandbox.factus.com.co}

# Envío de la factura electrónica por correo al cliente, vía relay SMTP de Brevo
# (mismo mecanismo y mismas variables de entorno que venta-service).
# Credenciales reales en .env (mismo mecanismo que CERT_ENCRYPTION_KEY, arriba).
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Servicios que consume la nota crédito para reintegrar stock y reversar el asiento
inventario.service.url=http://localhost:8082/api/surtiana/inventario
contabilidad.service.url=http://localhost:8091/api/pos/contabilidad/asientos
