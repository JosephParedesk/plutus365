spring.application.name=venta

server.port=${SERVER_PORT:8087}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

notification.service.url=http://localhost:9092/api/notification/send
spring.sql.init.mode=always

# URL base de inventario-service para descontar/incrementar stock al confirmar/anular una venta
inventario.service.url=http://localhost:8082/api/surtiana/inventario
contabilidad.service.url=http://localhost:8091/api/pos/contabilidad/asientos
empresa.service.url=http://localhost:8088/api/pos/empresa

# Envío de comprobante de venta por correo, vía relay SMTP de Brevo (300 correos/día gratis).
# Credenciales reales en .env (mismo mecanismo que CERT_ENCRYPTION_KEY en facturacion-service).
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:}
