spring.application.name=compra

server.port=${SERVER_PORT:8085}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

notification.service.url=http://localhost:9092/api/notification/send
spring.sql.init.mode=always
contabilidad.service.url=http://localhost:8091/api/pos/contabilidad/asientos
inventario.service.url=http://localhost:8082/api/surtiana/inventario
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB