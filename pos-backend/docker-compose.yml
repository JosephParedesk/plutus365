# Stack local de prueba (no apunta a tu MySQL real): levanta una base nueva
# y vacía dentro del contenedor, solo para validar que las imágenes de
# monolito-modular y gateway arrancan y se conectan entre sí. Usa un archivo
# .env en esta misma carpeta (ver .env.example) con tus propios valores.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ecommerce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  monolito:
    build: ./monolito-modular
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecommerce
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      CERT_ENCRYPTION_KEY: ${CERT_ENCRYPTION_KEY}
      FACTUS_BASE_URL: ${FACTUS_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "9000:9000"

  gateway:
    build: ./gateway
    depends_on:
      - monolito
    environment:
      JWT_SECRET: ${JWT_SECRET}
      MONOLITO_URL: http://monolito:9000
    ports:
      - "8090:8090"

volumes:
  mysql_data:
