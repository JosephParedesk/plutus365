spring.application.name=auth
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000

# URL del frontend, para armar el link de "restablecer contraseña" que se manda por correo.
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Correo de bienvenida y de recuperación de contraseña, vía relay SMTP de Brevo.
# Credenciales reales en .env (mismo mecanismo que CERT_ENCRYPTION_KEY en facturacion-service).
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:}
