plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// EntityScan / EnableJpaRepositories en AppApplication (los usa el bootstrap
	// del composition root, no lógica de negocio) necesitan esto en compileClasspath.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation project(':categoria')
	implementation project(':proveedor')
	implementation project(':cliente-service')

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}
