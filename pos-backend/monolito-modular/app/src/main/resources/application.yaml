# Puerto fijo del monolito (distinto del rango 8080-8092 de los microservicios
# standalone). El gateway le enruta /api/pos/categorias/** desde el 2026-09-11.
spring:
  application:
    name: monolito-modular
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  # facturacion-service: los otros módulos migrados (venta, cliente, empresa,
  # etc.) devuelven más campos de los que facturacion necesita al mapear sus
  # propios *Remota DTO — sin esto Jackson rechazaría esas respuestas. Es una
  # relajación global (tolerar campos desconocidos), no una restricción nueva,
  # así que no debería afectar a ningún otro módulo que dependa de rechazar
  # JSON con campos extra (ninguno lo hace hoy).
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 9000

# subscription-service (NotificationGatewayImpl): apunta a un servicio de
# notificaciones que nunca se construyó — falla y se traga la excepción hoy
# mismo en el standalone (ver catch en NotificationGatewayImpl). Se copia el
# mismo valor tal cual, arreglarlo es un cambio de comportamiento aparte.
notification:
  service:
    url: http://localhost:9092/api/notification/send

# auth
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 3600000
frontend:
  url: ${FRONTEND_URL:http://localhost:5173}
mail:
  from: ${MAIL_FROM:}

# empresa-service: logo se sirve como recurso estático (no vía gateway), ruta
# relativa al working dir del proceso. APP_PUBLIC_URL cambia a 9000 porque acá
# corre el monolito, no el standalone (8088) — logos ya subidos antes del
# cutover quedan en la carpeta vieja, no se migraron los archivos físicos.
app:
  upload:
    dir: ${UPLOAD_DIR:uploads/logos}
  public-url: ${APP_PUBLIC_URL:http://localhost:9000}

# facturacion-service — DIAN / Factus. CERT_ENCRYPTION_KEY tiene que ser
# EXACTAMENTE el mismo valor que ya usaba facturacion-service standalone: las
# credenciales de Factus de cada empresa ya están cifradas en la base real con
# esa llave — cambiarla las vuelve indescifrables (ver aviso en CLAUDE.md).
cert:
  encryption:
    key: ${CERT_ENCRYPTION_KEY:}
# Cada empresa elige ambiente en su ConfiguracionDian (switch factusSandbox en el
# panel de super admin) — estas dos URLs no se eligen acá, solo se pueden sobreescribir.
factus:
  base:
    url: ${FACTUS_BASE_URL:https://api.factus.com.co}
  sandbox:
    url: ${FACTUS_SANDBOX_URL:https://api-sandbox.factus.com.co}
