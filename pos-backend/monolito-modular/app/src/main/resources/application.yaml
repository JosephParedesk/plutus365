# Puerto fijo del monolito (distinto del rango 8080-8092 de los microservicios
# standalone). El gateway le enruta /api/pos/categorias/** desde el 2026-09-11.
spring:
  application:
    name: monolito-modular
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: 9000

# subscription-service (NotificationGatewayImpl): apunta a un servicio de
# notificaciones que nunca se construyó — falla y se traga la excepción hoy
# mismo en el standalone (ver catch en NotificationGatewayImpl). Se copia el
# mismo valor tal cual, arreglarlo es un cambio de comportamiento aparte.
notification:
  service:
    url: http://localhost:9092/api/notification/send
