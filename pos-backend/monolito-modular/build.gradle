plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'com.pos_backend'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	// Mismo BOM de versiones en todos los módulos, apliquen o no el plugin de
	// Spring Boot (solo `app` lo aplica — los módulos de negocio son librerías).
	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.6"
		}
	}

	// El plugin de Spring Boot agrega este flag automáticamente; los módulos
	// de negocio no lo aplican, así que hay que ponerlo a mano o los
	// @PathVariable/@RequestParam sin nombre explícito fallan en runtime.
	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs << '-parameters'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
