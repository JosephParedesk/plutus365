spring.application.name=subscription-service

server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

notification.service.url=http://localhost:9092/api/notification/send
spring.sql.init.mode=always

spring.web.resources.static-locations=file:./uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

categoria.service.url=http://localhost:8083/api/pos/categorias
proveedor.service.url=http://localhost:8084/api/pos/proveedores
contabilidad.service.url=http://localhost:8091/api/pos/contabilidad/asientos